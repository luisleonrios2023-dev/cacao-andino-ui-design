<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Magdalenas esponjosas y tiernas, perfectas para acompañar el café.">
    <title>Magdalenas | Cacao Andino</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/producto-detalle.css">
</head>

<body>
    <div id="header-container" data-partial="header"></div>
    <main>
        <div class="container producto-detalle-container">
            <nav class="migas" aria-label="Migas de pan">
                <ol>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li aria-current="page">Magdalenas</li>
                </ol>
            </nav>

            <article class="producto-detalle">
                <div class="producto-detalle-media">
                    <img
                        src="../img/magdalenas.jpg"
                        alt="Magdalenas doradas sobre un plato claro, una abierta mostrando la miga"
                        width="1200"
                        height="800"
                        decoding="async"
                        fetchpriority="high"
                    >
                </div>

                <div class="producto-detalle-info">
                    <p class="producto-detalle-etiqueta">Postres españoles</p>
                    <h1>Magdalenas</h1>
                    <p class="producto-detalle-descripcion">
                        Magdalenas esponjosas y tiernas, de sabor suave y perfectas para acompañar el café. Un dulce sencillo para disfrutar en cualquier momento.
                    </p>
                    <p class="producto-detalle-precio">2,00 € / unidad</p>

                    <div class="producto-detalle-acciones">
                        <a
                            href="#"
                            class="btn btn-primary"
                            aria-disabled="true"
                            aria-describedby="whatsapp-pending-description"
                            data-whatsapp-pending
                        >
                            Pedir por WhatsApp
                        </a>
                        <a href="productos.html" class="btn btn-secondary">Volver a Productos</a>
                    </div>
                </div>
            </article>
        </div>
    </main>
    <div id="footer-container" data-partial="footer"></div>
    <script src="../js/main.js" defer></script>
</body>

</html>
