<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pristiños ecuatorianos de masa frita, crujientes por fuera y con un delicado toque dulce.">
    <title>Pristiños | Cacao Andino</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/producto-detalle.css">
</head>

<body>
    <div id="header-container" data-partial="header"></div>
    <main>
        <div class="container producto-detalle-container">
            <nav class="migas" aria-label="Migas de pan">
                <ol>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li aria-current="page">Pristiños</li>
                </ol>
            </nav>

            <article class="producto-detalle">
                <div class="producto-detalle-media">
                    <img
                        src="../img/pristinos.jpg"
                        alt="Pristiños ecuatorianos"
                        width="1200"
                        height="800"
                        decoding="async"
                        fetchpriority="high"
                    >
                </div>

                <div class="producto-detalle-info">
                    <p class="producto-detalle-etiqueta">Postres ecuatorianos</p>
                    <h1>Pristiños</h1>

                    </p>
                    <p class="producto-detalle-precio">3,50 € / ración</p>

                    <div class="producto-detalle-acciones">
                        <a
                            href="#"
                            class="btn btn-primary"
                            aria-disabled="true"
                            aria-describedby="whatsapp-pending-description"
                            data-whatsapp-pending
                        >
                            Pedir por WhatsApp
                        </a>
                        <a href="productos.html" class="btn btn-secondary">Volver a Productos</a>
                    </div>
                </div>
            </article>
        </div>

    <div id="footer-container" data-partial="footer"></div>
    <script src="../js/main.js" defer></script>
